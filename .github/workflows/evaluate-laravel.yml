name: Evaluate Laravel Installation

on:
  workflow_dispatch:
    inputs:
      attempt_token:
        required: true
      submission_id:
        required: true
      exercise_slug:
        required: true
      test_suite:
        required: true
      student_branch:
        required: true
      student_repository:
        required: true

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Parse student repository URL
        id: parse
        run: |
          repo="${{ github.event.inputs.student_repository }}"
          repo="${repo#https://github.com/}"
          repo="${repo%.git}"
          echo "repo=${repo}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        run: |
          git clone --branch "${{ github.event.inputs.student_branch }}" \
            "https://x-access-token:${{ secrets.GITHUB_ACTIONS_TOKEN }}@github.com/${{ steps.parse.outputs.repo }}.git" student-repo
        shell: bash

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.4'

      - name: Install Composer Dependencies
        working-directory: student-repo
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Evaluate Laravel Installation
        working-directory: student-repo
        shell: bash
        run: |
          score=0
          checks='[]'

          if [ -f composer.json ]; then
            score=$((score + 15))
            checks=$(jq '. + [{"name":"composer.json","passed":true,"points":15,"message":"composer.json found"}]' <<<"$checks")
          else
            checks=$(jq '. + [{"name":"composer.json","passed":false,"points":0,"message":"composer.json missing"}]' <<<"$checks")
          fi

          if [ -f artisan ]; then
            score=$((score + 15))
            checks=$(jq '. + [{"name":"artisan","passed":true,"points":15,"message":"artisan found"}]' <<<"$checks")
          else
            checks=$(jq '. + [{"name":"artisan","passed":false,"points":0,"message":"artisan missing"}]' <<<"$checks")
          fi

          if [ -d app ]; then
            score=$((score + 15))
            checks=$(jq '. + [{"name":"app","passed":true,"points":15,"message":"app directory found"}]' <<<"$checks")
          else
            checks=$(jq '. + [{"name":"app","passed":false,"points":0,"message":"app directory missing"}]' <<<"$checks")
          fi

          if [ -d routes ]; then
            score=$((score + 15))
            checks=$(jq '. + [{"name":"routes","passed":true,"points":15,"message":"routes directory found"}]' <<<"$checks")
          else
            checks=$(jq '. + [{"name":"routes","passed":false,"points":0,"message":"routes directory missing"}]' <<<"$checks")
          fi

          if [ -d vendor ]; then
            score=$((score + 10))
            checks=$(jq '. + [{"name":"vendor","passed":true,"points":10,"message":"vendor directory found"}]' <<<"$checks")
          else
            checks=$(jq '. + [{"name":"vendor","passed":false,"points":0,"message":"vendor directory missing"}]' <<<"$checks")
          fi

          if php artisan --version > /dev/null 2>&1; then
            score=$((score + 10))
            checks=$(jq '. + [{"name":"artisan-version","passed":true,"points":10,"message":"artisan CLI works"}]' <<<"$checks")
          else
            checks=$(jq '. + [{"name":"artisan-version","passed":false,"points":0,"message":"artisan CLI failed"}]' <<<"$checks")
          fi

          passed=false
          if [ "$score" -ge 80 ]; then
            passed=true
          fi

          jq -n --arg token "${{ github.event.inputs.attempt_token }}" \
                --arg status "$([ "$passed" = true ] && echo completed || echo failed)" \
                --argjson score "$score" \
                --argjson passed "$passed" \
                --argjson total_points 100 \
                --argjson checks "$checks" \
                '{
                  attempt_token: $token,
                  status: ($status),
                  score: ($score),
                  passed: ($passed),
                  feedback: {
                    earned_points: $score,
                    total_points: $total_points,
                    checks: $checks
                  }
                }' > evaluation-results.json

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation-results.json

      - name: Send callback to academy
        env:
          ACADEMY_URL: ${{ secrets.ACADEMY_URL }}
          ACADEMY_SECRET: ${{ secrets.GITHUB_EXERCISE_CALLBACK_SECRET }}
        run: |
          body=$(cat evaluation-results.json)
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$ACADEMY_SECRET" | sed 's/^.* //')
          curl -s -X POST "$ACADEMY_URL/api/exercises/github-callback" \
            -H 'Content-Type: application/json' \
            -H "X-Academy-Signature: sha256=$signature" \
            -d "$body"
